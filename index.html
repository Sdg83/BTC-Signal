<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BTC Signal" />
  <meta name="theme-color" content="#050508" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>BTC Signal App</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508;
      color: #fff;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
    }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.7} }
    @keyframes glow    { 0%,100%{box-shadow:0 0 0 #f7931a00} 50%{box-shadow:0 0 22px #f7931a44} }
    @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.15} }

    .wrap   { max-width: 460px; margin: 0 auto; padding-top: 16px; }

    /* Header */
    .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
    .title  { font-family:'Orbitron',monospace; font-size:22px; font-weight:900; letter-spacing:4px; }
    .title span { color:#f7931a; }
    .subtitle { font-size:9px; color:#2a2a3a; letter-spacing:2px; margin-top:3px; }
    .status-dot { width:7px;height:7px;border-radius:50%;background:#00ff9d;animation:blink 1.5s infinite;display:inline-block;margin-right:5px; }
    .status-text { font-size:9px; color:#00ff9d; letter-spacing:1px; }
    .updated { font-size:9px; color:#333; margin-top:3px; text-align:right; }

    /* Price card */
    .price-card {
      background: linear-gradient(135deg,#0e0e1c,#090912);
      border: 1px solid #13131f;
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      animation: glow 4s ease-in-out infinite;
    }
    .price-card::before {
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,transparent,#f7931a,transparent);
    }
    .price-label { font-size:10px; color:#333; letter-spacing:2px; margin-bottom:6px; }
    .price-value { font-family:'Orbitron',monospace; font-size:38px; font-weight:900; letter-spacing:1px; }
    .price-change {
      display:inline-flex;align-items:center;gap:4px;
      margin-top:10px; padding:4px 12px; border-radius:4px;
      font-size:13px; font-weight:700;
    }
    .price-change.up   { background:#00ff9d18; border:1px solid #00ff9d44; color:#00ff9d; }
    .price-change.down { background:#ff3a5c18; border:1px solid #ff3a5c44; color:#ff3a5c; }

    /* Signal box */
    .signal-box {
      background:#080810; border:1px solid #111;
      border-radius:10px; padding:22px; margin-bottom:14px; text-align:center;
    }
    .signal-badge {
      display:inline-flex;align-items:center;
      padding:13px 32px; border-radius:4px;
      font-family:'Space Mono',monospace; font-weight:700; font-size:22px;
      letter-spacing:3px; animation:pulse 2.5s ease-in-out infinite;
    }
    .signal-badge.buy    { background:#00ff9d; color:#000; box-shadow:0 0 28px #00ff9d55; }
    .signal-badge.sell   { background:#ff3a5c; color:#fff; box-shadow:0 0 28px #ff3a5c55; }
    .signal-badge.hold   { background:#f5a623; color:#000; box-shadow:0 0 28px #f5a62355; }
    .tags { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .tag  { background:#0d0d1a; border:1px solid #1a1a2e; border-radius:4px; padding:5px 14px; font-size:10px; letter-spacing:1px; }
    .reason {
      margin-top:14px; padding:13px 16px;
      background:#050508; border-radius:6px; border-left:3px solid #f7931a;
      font-size:11px; color:#888; line-height:1.8; text-align:left;
    }

    /* Levels grid */
    .levels { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
    .level-card { background:#080810; border-radius:8px; padding:15px 8px; text-align:center; }
    .level-label { font-size:8px; color:#333; letter-spacing:1px; margin-bottom:8px; }
    .level-value { font-family:'Orbitron',monospace; font-size:13px; font-weight:700; }

    /* Indicators */
    .indicators {
      background:#080810; border:1px solid #111;
      border-radius:10px; padding:20px; margin-bottom:14px;
    }
    .section-title { font-size:9px; color:#2a2a3a; letter-spacing:2px; margin-bottom:18px; }
    .gauge-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:14px; }
    .gauge-label { font-size:10px; color:#555; letter-spacing:1px; margin-bottom:6px; text-align:center; }
    .gauge-track { height:5px; background:#111; border-radius:3px; overflow:hidden; }
    .gauge-fill  { height:100%; border-radius:3px; transition:width .8s; }
    .gauge-value { font-size:22px; font-weight:700; margin-top:7px; text-align:center; font-family:'Space Mono',monospace; }
    .ema-icon    { font-size:30px; text-align:center; margin-top:8px; }
    .ema-sub     { font-size:9px; color:#444; text-align:center; margin-top:4px; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #0c0c18; }
    .row-label { font-size:10px; color:#444; letter-spacing:1px; }
    .row-value { font-size:13px; font-weight:700; }

    /* SR */
    .sr-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    .sr-card { background:#080810; border-radius:10px; padding:18px; }
    .sr-label { font-size:9px; color:#2a2a3a; letter-spacing:1px; margin-bottom:8px; }
    .sr-value { font-family:'Orbitron',monospace; font-size:17px; font-weight:700; }

    /* Disclaimer */
    .disclaimer {
      padding:10px 14px; background:#080810; border:1px solid #111;
      border-radius:8px; font-size:9px; color:#2a2a3a; line-height:1.7; text-align:center;
      margin-top:14px;
    }
  </style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ── Data (actualizar manualmente o via Claude) ────────────────────────────────
const D = {
  price:       70969,
  change24h:   -3.99,
  signal:      "MANTENER",
  strength:    "MODERADA",
  trend:       "LATERAL",
  rsi:         46,
  ema20:       72400,
  ema50:       71100,
  support:     71835,
  resistance:  75000,
  entry:       71000,
  target:      76500,
  stopLoss:    69000,
  sentiment:   "MIEDOSO",
  reason:      "BTC retrocede desde el máximo de $75,912 mientras los mercados esperan la decisión de la Fed hoy. RSI cayendo hacia zona neutral-baja y el precio está por debajo de ambas EMAs — cautela recomendada hasta confirmar dirección post-FOMC.",
  updatedAt:   "18 Mar 2026 · 11:00 AM ET",
  source:      "CoinDesk / Fortune",
};

// ── Helpers ────────────────────────────────────────────────────────────────────
const fmt  = n => Number(n).toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:0});
const col  = (v, up="#00ff9d", dn="#ff3a5c") => v ? up : dn;

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  const priceUp = D.change24h >= 0;
  const sigClass = D.signal === "COMPRAR" ? "buy" : D.signal === "VENDER" ? "sell" : "hold";
  const sigLabel = D.signal === "COMPRAR" ? "▲ COMPRAR" : D.signal === "VENDER" ? "▼ VENDER" : "◆ MANTENER";
  const trendCol = D.trend === "ALCISTA" ? "#00ff9d" : D.trend === "BAJISTA" ? "#ff3a5c" : "#f5a623";
  const trendPfx = D.trend === "ALCISTA" ? "↑ " : D.trend === "BAJISTA" ? "↓ " : "→ ";
  const sentCol  = D.sentiment === "CODICIOSO" ? "#00ff9d" : D.sentiment === "MIEDOSO" ? "#ff3a5c" : "#f5a623";
  const rsiColor = D.rsi < 30 ? "#00ff9d" : D.rsi > 70 ? "#ff3a5c" : "#f5a623";
  const emaColor20 = D.price > D.ema20 ? "#00ff9d" : "#ff3a5c";
  const emaColor50 = D.price > D.ema50 ? "#00ff9d" : "#ff3a5c";

  document.getElementById("app").innerHTML = `
    <!-- Header -->
    <div class="header">
      <div>
        <div class="title">BTC <span>SIGNAL</span></div>
        <div class="subtitle">ANÁLISIS POR CLAUDE AI</div>
      </div>
      <div style="text-align:right">
        <div style="display:flex;align-items:center;justify-content:flex-end">
          <span class="status-dot"></span>
          <span class="status-text">ACTIVO</span>
        </div>
        <div class="updated">${D.updatedAt}</div>
        <div class="updated" style="font-size:8px;color:#1e1e2e">${D.source}</div>
      </div>
    </div>

    <!-- Price -->
    <div class="price-card">
      <div class="price-label">BITCOIN / USDT</div>
      <div class="price-value">$${fmt(D.price)}</div>
      <div class="price-change ${priceUp ? 'up' : 'down'}">
        ${priceUp ? '▲' : '▼'} ${Math.abs(D.change24h).toFixed(2)}%&nbsp; 24H
      </div>
    </div>

    <!-- Signal -->
    <div class="signal-box">
      <div class="signal-badge ${sigClass}">${sigLabel}</div>
      <div class="tags">
        <span class="tag" style="color:${trendCol}">${trendPfx}${D.trend}</span>
        <span class="tag" style="color:#666">${D.strength}</span>
        <span class="tag" style="color:${sentCol}">${D.sentiment}</span>
      </div>
      <div class="reason">${D.reason}</div>
    </div>

    <!-- Entry / Target / Stop -->
    <div class="levels">
      <div class="level-card" style="border:1px solid #f5a62320">
        <div class="level-label">ENTRADA</div>
        <div class="level-value" style="color:#f5a623">$${fmt(D.entry)}</div>
      </div>
      <div class="level-card" style="border:1px solid #00ff9d20">
        <div class="level-label">OBJETIVO</div>
        <div class="level-value" style="color:#00ff9d">$${fmt(D.target)}</div>
      </div>
      <div class="level-card" style="border:1px solid #ff3a5c20">
        <div class="level-label">STOP LOSS</div>
        <div class="level-value" style="color:#ff3a5c">$${fmt(D.stopLoss)}</div>
      </div>
    </div>

    <!-- Indicators -->
    <div class="indicators">
      <div class="section-title">INDICADORES TÉCNICOS</div>
      <div class="gauge-grid">
        <div>
          <div class="gauge-label">RSI (14)</div>
          <div class="gauge-track">
            <div class="gauge-fill" style="width:${D.rsi}%;background:${rsiColor}"></div>
          </div>
          <div class="gauge-value" style="color:${rsiColor}">${D.rsi}</div>
        </div>
        <div>
          <div class="gauge-label">CRUCE EMAs</div>
          <div class="ema-icon">${D.ema20 > D.ema50 ? '📈' : '📉'}</div>
          <div class="ema-sub">${D.ema20 > D.ema50 ? 'EMA20 > EMA50' : 'EMA20 < EMA50'}</div>
        </div>
      </div>
      <div class="row">
        <span class="row-label">EMA 20</span>
        <span class="row-value" style="color:${emaColor20}">$${fmt(D.ema20)}</span>
      </div>
      <div class="row">
        <span class="row-label">EMA 50</span>
        <span class="row-value" style="color:${emaColor50}">$${fmt(D.ema50)}</span>
      </div>
      <div class="row" style="border:none">
        <span class="row-label">PRECIO vs EMA20</span>
        <span class="row-value" style="color:${emaColor20}">${D.price > D.ema20 ? 'POR ENCIMA ↑' : 'POR DEBAJO ↓'}</span>
      </div>
    </div>

    <!-- Support / Resistance -->
    <div class="sr-grid">
      <div class="sr-card" style="border:1px solid #00ff9d20">
        <div class="sr-label">SOPORTE</div>
        <div class="sr-value" style="color:#00ff9d">$${fmt(D.support)}</div>
      </div>
      <div class="sr-card" style="border:1px solid #ff3a5c20">
        <div class="sr-label">RESISTENCIA</div>
        <div class="sr-value" style="color:#ff3a5c">$${fmt(D.resistance)}</div>
      </div>
    </div>

    <div class="disclaimer">
      ⚠ SOLO PARA REFERENCIA. NO ES CONSEJO FINANCIERO.<br>OPERA BAJO TU PROPIO RIESGO.
    </div>
  `;
}

render();

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
