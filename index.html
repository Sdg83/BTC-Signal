<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Signal PRO</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body {
  background:#050508;
  color:#fff;
  font-family:monospace;
  text-align:center;
  padding:10px;
}

.card {
  background:#0b0b15;
  border-radius:10px;
  padding:20px;
  margin-bottom:10px;
}

.price { font-size:32px; font-weight:bold; }

.up { color:#00ff9d }
.down { color:#ff3a5c }

.signal {
  font-size:22px;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
}

.buy { background:#00ff9d; color:#000 }
.sell { background:#ff3a5c }
.hold { background:#f5a623; color:#000 }

</style>
</head>

<body>

<h2>BTC SIGNAL PRO</h2>

<div class="card">
  <div id="price" class="price">Cargando...</div>
  <div id="change"></div>
</div>

<div class="card">
  <div id="signal" class="signal">...</div>
  <div id="rsi"></div>
</div>

<div class="card">
  <div id="tv-chart" style="height:300px;"></div>
</div>

<script>

let D = {
  price:0,
  change:0,
  rsi:50,
  ema20:0,
  ema50:0,
  signal:"..."
};

// 📊 Obtener precio
async function getPrice(){
  const res = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT");
  const data = await res.json();

  D.price = parseFloat(data.lastPrice);
  D.change = parseFloat(data.priceChangePercent);
}

// 📈 Obtener velas y calcular RSI + EMAs
async function getIndicators(){
  const res = await fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=50");
  const data = await res.json();

  const closes = data.map(c => parseFloat(c[4]));

  // RSI simple
  let gains=0, losses=0;
  for(let i=1;i<closes.length;i++){
    let diff = closes[i]-closes[i-1];
    if(diff>0) gains+=diff;
    else losses-=diff;
  }
  let rs = gains/(losses || 1);
  D.rsi = 100-(100/(1+rs));

  // EMA
  const ema = (period)=>{
    let k = 2/(period+1);
    let ema = closes[0];
    closes.forEach(p=>{
      ema = p*k + ema*(1-k);
    });
    return ema;
  }

  D.ema20 = ema(20);
  D.ema50 = ema(50);
}

// 🧠 Señal automática
function calculateSignal(){

  if(D.price > D.ema20 && D.rsi > 55){
    D.signal = "COMPRAR";
  }
  else if(D.price < D.ema50 && D.rsi < 45){
    D.signal = "VENDER";
  }
  else{
    D.signal = "MANTENER";
  }
}

// 🎨 Render
function render(){

  let priceEl = document.getElementById("price");
  let changeEl = document.getElementById("change");
  let signalEl = document.getElementById("signal");
  let rsiEl = document.getElementById("rsi");

  priceEl.innerHTML = "$" + D.price.toFixed(0);

  changeEl.innerHTML = D.change.toFixed(2) + "%";
  changeEl.className = D.change >=0 ? "up" : "down";

  signalEl.innerHTML = D.signal;

  signalEl.className = "signal " + 
    (D.signal==="COMPRAR"?"buy":
     D.signal==="VENDER"?"sell":"hold");

  rsiEl.innerHTML = "RSI: " + D.rsi.toFixed(0);
}

// 🔄 Update completo
async function update(){
  await getPrice();
  await getIndicators();
  calculateSignal();
  render();
}

setInterval(update,10000);
update();

// 📊 TradingView
new TradingView.widget({
  container_id: "tv-chart",
  symbol: "BINANCE:BTCUSDT",
  interval: "60",
  theme: "dark"
});

</script>

</body>
</html>
